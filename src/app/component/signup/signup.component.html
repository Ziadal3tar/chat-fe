<div class="auth-page">
  <section class="auth-shell">
    <aside class="brand-panel">
      <div class="brand-top"><div class="brand-mark"><i class="fa-solid fa-paper-plane"></i></div><p class="brand-name">Chatly</p></div>
      <div class="brand-content">
        <h1>ابدأ محادثتك الأولى.</h1>
        <p>أنشئ حسابك في خطوات بسيطة، ثم ابدأ التواصل ومشاركة الملفات مع أصدقائك.</p>
        <img class="brand-art" src="./assets/img/Sign up-bro.svg" alt="إنشاء حساب" />
      </div>
      <div class="brand-footer">حساب واحد. محادثاتك كلها في مكان واحد.</div>
    </aside>

    <main class="form-panel">
      <div class="form-wrap">
        <p class="eyebrow">إنشاء حساب</p>
        <h2>أهلًا بك</h2>
        <p class="subtitle">أنشئ حسابك وابدأ استخدام Chatly فورًا.</p>

        <div class="form-grid">
          <div class="form-group"><label class="field-label">اسم المستخدم</label><div class="field"><i class="field-icon fa-solid fa-user"></i><input type="text" [(ngModel)]="userName" placeholder="اسمك" autocomplete="name" /></div></div>
          <div class="form-group"><label class="field-label">رقم الهاتف</label><div class="field"><i class="field-icon fa-solid fa-phone"></i><input type="tel" [(ngModel)]="phone" placeholder="01xxxxxxxxx" autocomplete="tel" /></div></div>
          <div class="form-group full"><label class="field-label">البريد الإلكتروني</label><div class="field"><i class="field-icon fa-solid fa-envelope"></i><input type="email" [(ngModel)]="email" placeholder="example@email.com" autocomplete="email" /></div></div>
          <div class="form-group"><label class="field-label">كلمة المرور</label><div class="field"><i class="field-icon fa-solid fa-lock"></i><input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" /><button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"><i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i></button></div></div>
          <div class="form-group"><label class="field-label">تأكيد كلمة المرور</label><div class="field"><i class="field-icon fa-solid fa-shield-halved"></i><input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" /><button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"><i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i></button></div></div>
        </div>

        <div *ngIf="errorMessage" class="server-error">{{ errorMessage }}</div>
        <button type="button" class="primary-btn" [disabled]="loading" (click)="register()"><span *ngIf="!loading">إنشاء الحساب</span><span *ngIf="loading">جاري إنشاء الحساب...</span><span *ngIf="loading" class="spinner" aria-hidden="true"></span><i *ngIf="!loading" class="fa-solid fa-arrow-left"></i></button>
        <p class="login-link">لديك حساب بالفعل؟ <a (click)="goToLogin()">تسجيل الدخول</a></p>
      </div>
    </main>
  </section>
</div>
