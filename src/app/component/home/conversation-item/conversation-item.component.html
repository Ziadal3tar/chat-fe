<div class="conversation-item" [class.has-unread]="item?.unreadCount > 0" (click)="select()" role="button" tabindex="0" (keydown.enter)="select()" (keydown.space)="$event.preventDefault(); select()">
  <div class="conversation-avatar" [style.background-image]="'url(' + profileImage + ')'" [attr.aria-label]="userName + ' avatar'">
    <span *ngIf="isOnline" class="avatar-status"></span>
  </div>

  <div class="conversation-content">
    <div class="conversation-topline">
      <strong>{{ userName }} <i *ngIf="item?.isPinned" class="fa-solid fa-thumbtack" title="Pinned"></i><i *ngIf="item?.isMuted" class="fa-solid fa-bell-slash" title="Muted"></i></strong>
      <span *ngIf="isChat">{{ item?.lastMessage?.date }} {{ item?.lastMessage?.time }}</span>
    </div>

    <div class="conversation-bottomline">
      <p *ngIf="isChat && item?.lastMessage?.fileType !== 'image' && !item?.lastMessage?.isDeleted">
        <i *ngIf="item?.lastMessage?.fileType === 'video'" class="fa-regular fa-circle-play"></i>
        <i *ngIf="item?.lastMessage?.fileType === 'audio'" class="fa-solid fa-microphone"></i>
        <i *ngIf="item?.lastMessage?.fileType === 'pdf'" class="fa-regular fa-file-lines"></i>
        {{ item?.lastMessage?.content || attachmentLabel }}
      </p>
      <p *ngIf="isChat && item?.lastMessage?.isDeleted" class="deleted-preview">
        <i class="fa-regular fa-trash-can"></i> This message was deleted
      </p>
      <p *ngIf="isChat && item?.lastMessage?.fileType === 'image'"><i class="fa-regular fa-image"></i> Image</p>
      <p *ngIf="!isChat">Start a conversation</p>

      <span *ngIf="item?.unreadCount > 0" class="unread-count">
        {{ item?.unreadCount > 99 ? '99+' : item?.unreadCount }}
      </span>
    </div>
  </div>

  <button type="button" class="conversation-profile-btn" (click)="viewProfile($event)" aria-label="View profile">
    <i class="fa-regular fa-user"></i>
  </button>
</div>
