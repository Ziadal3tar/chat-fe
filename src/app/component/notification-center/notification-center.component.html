<div class="notification-center" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="notification-trigger"
    [class.has-unread]="unreadCount > 0"
    [attr.aria-expanded]="panelOpen"
    aria-label="Notifications"
    title="Notifications"
    (click)="togglePanel($event)"
  >
    <i class="fa-regular fa-bell"></i>
    <span *ngIf="unreadCount > 0" class="notification-badge">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <section *ngIf="panelOpen" class="notification-panel" role="dialog" aria-label="Notifications">
    <header class="notification-panel-header">
      <div>
        <span class="notification-kicker">ACTIVITY</span>
        <h3>Notifications</h3>
      </div>

      <button
        type="button"
        class="mark-all-btn"
        [disabled]="unreadCount === 0"
        (click)="markAllAsRead()"
      >
        Mark all read
      </button>
    </header>

    <div *ngIf="loading" class="notification-state">
      <span class="notification-spinner"></span>
      <span>Loading notifications...</span>
    </div>

    <div *ngIf="!loading && error" class="notification-state notification-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>{{ error }}</span>
      <button type="button" (click)="loadNotifications()">Retry</button>
    </div>

    <div
      *ngIf="!loading && !error && notifications.length === 0"
      class="notification-state"
    >
      <div class="notification-empty-icon">
        <i class="fa-regular fa-bell-slash"></i>
      </div>
      <strong>No notifications yet</strong>
      <span>New messages and friend activity will appear here.</span>
    </div>

    <div *ngIf="!loading && !error && notifications.length > 0" class="notification-list">
      <div
        *ngFor="let notification of notifications; trackBy: trackById"
        class="notification-item"
        [class.unread]="!notification.isRead"
        role="button"
        tabindex="0"
        (click)="onNotificationClick(notification)"
        (keydown.enter)="onNotificationClick(notification)"
        (keydown.space)="onNotificationKeydown($event, notification)"
      >
        <div class="notification-avatar">
          <img
            *ngIf="notification.actor?.profileImage; else notificationIconTemplate"
            [src]="notification.actor?.profileImage"
            [alt]="notification.actor?.userName || 'User'"
          />

          <ng-template #notificationIconTemplate>
            <i [class]="notificationIcon(notification.type)"></i>
          </ng-template>
        </div>

        <div class="notification-content">
          <div class="notification-title-row">
            <strong>{{ notification.title }}</strong>
            <span class="notification-dot" *ngIf="!notification.isRead"></span>
          </div>
          <p>{{ notification.message }}</p>
          <time>{{ notification.createdAt | date:'MMM d, h:mm a' }}</time>
        </div>

        <button
          type="button"
          class="notification-delete"
          aria-label="Delete notification"
          title="Delete notification"
          (click)="deleteNotification($event, notification)"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

    </div>

    <button
      *ngIf="!loading && !error && page < pages"
      type="button"
      class="load-more-btn"
      [disabled]="loadingMore"
      (click)="loadMore()"
    >
      <span *ngIf="loadingMore" class="notification-spinner small"></span>
      {{ loadingMore ? 'Loading...' : 'Load more' }}
    </button>

</div>
